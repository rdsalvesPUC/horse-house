<div class="w-full max-w-4xl xl:max-w-[80%] px-6 py-6 space-y-6">
	<div class="flex flex-row flex-1 justify-between">
		<div class="mb-6">
			<h1 class="text-3xl font-bold tracking-tight">Simulador de Custos</h1>
			<p class="text-muted-foreground mt-2">Calcule os custos mensais e anuais do seu haras</p>
		</div>
		<!-- <div>
			<a href="/dashboard/usuarios" data-view="usuarios" class="btn-form-previous">Voltar</a>
		</div> -->
	</div>
	<div class="flex flex-row gap-8">
		<div class="w-1/2 bg-white rounded-lg shadow p-6">
			<form id="form-cadastro">
				<div class="flex flex-col gap-8">
					<div id="container-haras" class="flex flex-col gap-2">
						<label for="select-haras" class="font-medium">Selecione o Haras</label>
						<select id="select-haras" class="rounded-md p-3 text-sm border border-secondary">
							<option value="">Selecione o Haras</option>
						</select>
						<span id="erro-haras" class="text-xs text-red-500 hidden">Selecione um Haras</span>
					</div>

					<div class="flex 2xl:flex-row flex-col gap-4 w-full items-end">
						<div class="flex flex-col gap-2 w-full">
							<label for="numero-cavalos" class="font-medium">Número de Cavalos</label>
							<input id="numero-cavalos" type="number" class="rounded-md p-3 text-sm border border-secondary" placeholder="0" />
						</div>

						<div class="flex flex-col gap-2 w-full">
							<label for="numero-cavalos" class="font-medium">Custo de Alimentação por Cavalo (R$)</label>
							<input id="numero-cavalos" type="number" step="0.1" class="rounded-md p-3 text-sm border border-secondary" placeholder="R$ 000,00" />
						</div>
					</div>

					<div class="flex 2xl:flex-row flex-col gap-4 w-full items-end">
						<div class="flex flex-col gap-2 w-full">
							<label for="numero-cavalos" class="font-medium">Visitas Veterinárias por Mês</label>
							<input id="numero-cavalos" type="number" class="rounded-md p-3 text-sm border border-secondary" placeholder="0" />
						</div>

						<div class="flex flex-col gap-2 w-full">
							<label for="numero-cavalos" class="font-medium">Custo por Visita Veterinária (R$)</label>
							<input id="numero-cavalos" type="number" step="0.1" class="rounded-md p-3 text-sm border border-secondary" placeholder="R$ 000,00" />
						</div>
					</div>

					<div class="flex 2xl:flex-row flex-col gap-4 w-full items-end">
						<div class="flex flex-col gap-2 w-full">
							<label for="numero-cavalos" class="font-medium">Número de Funcionários</label>
							<input id="numero-cavalos" type="number" class="rounded-md p-3 text-sm border border-secondary" placeholder="0" />
						</div>

						<div class="flex flex-col gap-2 w-full">
							<label for="numero-cavalos" class="font-medium">Salário Médio por Funcionário (R$)</label>
							<input id="numero-cavalos" type="number" step="0.1" class="rounded-md p-3 text-sm border border-secondary" placeholder="R$ 000,00" />
						</div>
					</div>

					<div class="flex flex-col gap-2 w-full">
						<label for="numero-cavalos" class="font-medium">Outros Custos Mensais (R$)</label>
						<input id="numero-cavalos" type="number" step="0.1" class="rounded-md p-3 text-sm border border-secondary" placeholder="R$ 000,00" />
					</div>

					<button type="submit" class="bg-secondary text-tertiary p-3 rounded-md hover:bg-primary transition-all">Calcular Custos</button>
				</div>
			</form>
		</div>
		<div class="w-1/2 flex flex-col gap-8">
			<div class="bg-white rounded-lg shadow p-6">
				<h2 class="text-xl font-medium tracking-tight">Resultado do Cálculo</h2>
				<div></div>
			</div>
			<div class="bg-white rounded-lg shadow p-6">
				<h2 class="text-xl font-medium tracking-tight">Distribuição de Custos - Gráfico Pizza</h2>
				<div></div>
			</div>
			<div class="bg-white rounded-lg shadow p-6">
				<h2 class="text-xl font-medium tracking-tight">Distribuição de Custos - Gráfico Barras</h2>
				<div></div>
			</div>
		</div>
	</div>
</div>
